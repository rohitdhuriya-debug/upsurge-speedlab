services:
  speedlab:
    build: .
    image: upsurge-speedlab
    container_name: speedlab
    ports:
      # Host port (default 5090) -> container 5070. Bound to localhost; public
      # access is meant to arrive through the tunnel, not by opening this to the
      # LAN. Override with SPEEDLAB_HOST_PORT when the port is already taken.
      - "127.0.0.1:${SPEEDLAB_HOST_PORT:-5090}:5070"
    volumes:
      - ./data:/data
    environment:
      # REQUIRED whenever this is reachable from anywhere but this machine.
      SPEEDLAB_AUTH_TOKEN: "${SPEEDLAB_AUTH_TOKEN:-}"
      # 1 = this instance is reachable from outside the machine. Disables the
      # reveal endpoint outright, since that runs a command on the host.
      SPEEDLAB_PUBLIC: "${SPEEDLAB_PUBLIC:-0}"
      SPEEDLAB_MAX_UPLOAD_MB: "${SPEEDLAB_MAX_UPLOAD_MB:-4096}"
      SPEEDLAB_MAX_FILES: "${SPEEDLAB_MAX_FILES:-50}"
    restart: unless-stopped
